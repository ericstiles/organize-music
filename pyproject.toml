[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "organize-music"
version = "0.1.0"
description = "Tools and scripts for organizing a music library, reading metadata, de-duplicating, and tidying structure."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mutagen>=1.47",
    "pyyaml>=6.0",
    "fastapi>=0.163,<0.164",
    "uvicorn>=0.54,<0.55",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.34",
    "itsdangerous>=2.2,<3",
    "mediafile>=0.17,<0.18",
    "yoyo-migrations==9.0.0",
]

[project.scripts]
organize-music = "organize_music.cli:main"

[tool.setuptools.package-data]
organize_music = ["db/migrations/*.sql"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "pytest-cov>=5.0.0",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["organize_music"]

[tool.coverage.run]
source = ["organize_music"]
omit = ["*/organize_music/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
