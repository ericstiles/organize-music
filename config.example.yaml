# organize-music configuration. Copy to one of these locations:
#   $XDG_CONFIG_HOME/organize_music/config.yaml   (usually ~/.config/organize_music/config.yaml)
# or pass it explicitly:  organize-music meta --config /path/to/config.yaml
#
# Every setting is optional. `library` and `quarantine` fall back to the environment
# variables MUSIC_LIB and MUSIC_QUARANTINE; quarantine otherwise sits beside the library.
# CLI flags (--index, --report, and the root argument) override the file.
# The tool never writes this file.

# Root of the music library to scan. Also the default `root` when none is given.
# library: /path/to/Music          # or export MUSIC_LIB

# SQLite index (cache of tags and hashes). Must be OUTSIDE the library, and
# outside the deploy target (~/$PI_DIR, e.g. ~/organize_music) so that
# `rsync --delete` cannot delete it. Lives in the XDG data dir by default.
index: ~/.local/share/organize_music/index.db

# Directory where Markdown reports are written. Must be OUTSIDE the library.
reports: ~/organize_music/reports

# Where duplicate leftovers are moved, later, by the organize/quarantine steps.
# Same disk as the library but outside it, so moves are instant. Must be OUTSIDE the library.
# quarantine: /path/to/_quarantine  # or export MUSIC_QUARANTINE

# Target layout for the future `organize` step (preview only until then).
# Placeholders: ${artist} ${album} ${title} ${track} ${ext}
folder_format: "${artist}/${album}/${track}-${title}.${ext}"

# Top-level folders treated as collections, not artists: skipped when guessing
# artist/album from folder names (these held copies, not one artist each).
skip_folders:
  - Music2
  - music
  - OrganizesByGenre
  - ipod_favs
  - osx_sd_card_a_to_b

# --- Web-server and mutation settings (Phase 1) --------------------------------
# The CLI never needed these; the web server and mutation engine do.

# Mount point of the exFAT library volume. Checked at server startup
# (os.path.ismount + that the library root exists); no CLI equivalent.
library_mount: /media/ets04uga/Extreme

# Scratch space for tmp copies and the JSONL operation-log mirror. Must be on the
# same SSD as the library (so a move is an instant rename) and OUTSIDE the library.
work_dir: /media/ets04uga/Extreme/PlaceHereToKeepFromWork/_organize_music_work

# Where originals are parked instead of deleted. The tool never deletes a library
# file; the owner empties this folder by hand. Same SSD, OUTSIDE the library.
purge_dir: /media/ets04uga/Extreme/PlaceHereToKeepFromWork/purge

# Where library.db, backups, auth and the writer lock live (the XDG data dir).
# Kept off the exFAT volume and off the rsync deploy target.
state_dir: ~/.local/share/organize_music

# Address the web server binds. 127.0.0.1 keeps it on localhost; set the Pi's LAN
# address to reach it on the network. Never 0.0.0.0 by default.
bind_host: 127.0.0.1

# Port the web server listens on (1-65535).
bind_port: 8765

# With this off the preview works but confirm returns 403 MUTATIONS_DISABLED, so
# the tool can never move or edit a file until the owner turns it on.
mutations_enabled: false
