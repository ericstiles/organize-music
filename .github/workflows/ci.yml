name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' -r requirements-dev.txt

      - name: Build wheel
        run: python -m pip wheel --no-deps -w dist .

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Tests
        run: pytest -q --cov=organize_music --cov-report=term --cov-fail-under=80

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      # pip-audit is installed inside this CI job only; it is deliberately not
      # part of the project's dependencies (pyproject.toml / requirements-dev.txt).
      - name: Install project and pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' -r requirements-dev.txt
          python -m pip install pip-audit

      # Any advisory accepted must be listed here with --ignore-vuln <ID> and a
      # YAML comment giving the reason and date. None are accepted.
      - name: Audit dependencies
        run: pip-audit --strict --skip-editable
